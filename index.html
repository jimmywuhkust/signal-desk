<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>Signal Desk</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(ellipse at 22% 20%,#233b46 0,transparent 48%),#09121c;color:#e7eef7;font-family:system-ui,-apple-system,sans-serif}.card{width:min(440px,calc(100% - 40px));padding:44px;background:#101e2cdd;border:1px solid #304353;border-radius:20px;box-shadow:0 30px 80px #0005}.mark{color:#82e1c1;font-size:42px}small{color:#7592a7;letter-spacing:3px;font-size:10px}h1{font-size:34px;font-weight:550;margin:18px 0 8px}p{font-size:14px;line-height:1.7;color:#9badbc}label{font-size:12px;color:#b5c7d3}input{display:block;width:100%;padding:14px;background:#091522;border:1px solid #314859;border-radius:9px;color:#e8f4f8;margin:9px 0 15px;font-size:16px}button{width:100%;padding:14px;border:0;border-radius:9px;background:#83e2c2;color:#0c3027;font-weight:700;font-size:14px;cursor:pointer}button:disabled{opacity:.5}#error{min-height:22px;color:#efb7b7;font-size:12px}.foot{font-size:11px;color:#6b8398;margin-top:25px}input:focus{outline:1px solid #83e2c2}</style></head><body><main class="card"><div class="mark">◈</div><small>LOCAL WORKSPACE</small><h1>Signal Desk</h1><p>你的本地工作台。<br>输入访问口令，继续。</p><form id="unlock"><label for="password">访问口令</label><input id="password" type="password" autocomplete="current-password" required><button id="enter">进入工作台 →</button><p id="error" role="status"></p></form><div class="foot">内容在浏览器中解锁。<br>本地访问门不提供服务器身份认证。</div></main><script>
const decode=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
document.getElementById('unlock').onsubmit=async e=>{e.preventDefault();const button=document.getElementById('enter'),error=document.getElementById('error');button.disabled=true;error.textContent='';try{if(!crypto.subtle)throw Error('请使用 HTTPS 或 localhost');const response=await fetch(new URL('sealed.json',location.href),{cache:'no-store'});if(!response.ok)throw Error('内容未加载');const box=await response.json();if(box.v!==1||box.kdf!=='PBKDF2-SHA256'||box.iterations!==150000)throw Error('内容格式不支持');const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(document.getElementById('password').value),'PBKDF2',false,['deriveKey']);const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:decode(box.salt),iterations:box.iterations,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['decrypt']);const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:decode(box.iv)},key,decode(box.ciphertext));document.getElementById('password').value='';document.open();document.write(new TextDecoder().decode(plain));document.close();}catch(e){error.textContent=e.name==='OperationError'?'口令不正确，请重试。':'无法解锁：'+e.message;button.disabled=false;}};
</script></body></html>
